.ov__row { display: flex; justify-content: space-between; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,.05); }
.ov__row.me { color: var(--accent-strong); }
/* ana menü v2 */
.home { background: radial-gradient(90% 70% at 50% 35%, var(--felt-hi), var(--felt-mid) 45%, var(--bg-deep)); }
.home::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, var(--weave) 0 1px, transparent 1px 3px); opacity: .7; pointer-events: none; }
.home::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 6px var(--rim-2), inset 0 0 0 8px var(--brass, #b8924f), inset 0 0 120px rgba(0,0,0,.6); pointer-events: none; }
.home__in { position: relative; z-index: 1; gap: clamp(10px, 3vmin, 22px); width: min(760px, 94vw); }
.home__head { text-align: center; line-height: .9; }
.home__modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.mode { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 14px 14px; border-radius: 20px; border: 1px solid rgba(216,184,120,.35); background: linear-gradient(180deg, rgba(40,28,14,.85), rgba(16,12,8,.9)); color: var(--ink); box-shadow: 0 14px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); transition: transform 180ms var(--ease-out), border-color 180ms; touch-action: manipulation; }
.mode:active { transform: scale(.97); }
@media (hover: hover) { .mode:hover { transform: translateY(-3px); border-color: var(--accent-strong); } }
.mode__t { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 4.5vmin, 1.8rem); color: var(--accent-strong); }
.mode__d { font-size: .78rem; color: var(--ink-dim); text-align: center; text-wrap: balance; }
.mode__tiles { display: flex; gap: 3px; padding: 6px 8px 8px; border-radius: 8px; background: linear-gradient(180deg, var(--rack-1), var(--rack-3)); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 6px 12px rgba(0,0,0,.5); }
.mt { position: relative; width: clamp(26px, 7vmin, 38px); aspect-ratio: 1 / 1.36; border-radius: 5px; background: linear-gradient(180deg, #fffaf0, #ecdfc4); box-shadow: inset 0 -3px 0 rgba(120,90,50,.35), 0 2px 3px rgba(0,0,0,.4); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-num); font-weight: 800; font-size: clamp(15px, 4vmin, 22px); line-height: 1; }
.mt i { width: 5px; height: 5px; margin-top: 3px; border-radius: 50%; background: currentColor; }
.mt--r { color: #c8302c; } .mt--b { color: #1f5fae; } .mt--k { color: #1d1d1d; } .mt--y { color: #d18a0f; }
.mt--okey { color: #c89520; background: linear-gradient(180deg, #fff3c9, #f0d383); }
.mt--okey i { display: none; }
.home__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
@media (max-height: 420px) { .home h1 { font-size: 2.6rem; } .mode { padding: 10px; } }

/* ───────── Sayfa (sheet) bileşeni ───────── */
.sheet-wrap { position: absolute; inset: 0; z-index: 300; display: grid; place-items: center; padding: max(10px, var(--safe-t)) max(12px, var(--safe-r)) max(10px, var(--safe-b)) max(12px, var(--safe-l)); background: rgba(3, 8, 6, .62); backdrop-filter: blur(3px); animation: sheet-fade 200ms ease-out both; }
.sheet-wrap.is-out { animation: sheet-fade 200ms ease-in reverse both; }
@keyframes sheet-fade { from { opacity: 0; } }
.sheet { width: min(560px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 20px; background: linear-gradient(180deg, #1b2a25, #101915); border: 1px solid rgba(216,184,120,.28); box-shadow: 0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); animation: sheet-in 320ms var(--ease-out) both; overflow: hidden; }
@keyframes sheet-in { from { transform: translateY(16px) scale(.97); opacity: 0; } }
.sheet__head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 6px 18px; }
.sheet__head h2 { flex: 1; margin: 0; font-family: var(--font-display); font-size: 1.25rem; color: var(--accent-strong); text-wrap: balance; }
.sheet__x svg { stroke: currentColor; stroke-width: 2; fill: none; }
.sheet__body { padding: 4px 18px 12px; overflow: auto; min-height: 0; }
.sheet__foot { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px 14px; border-top: 1px solid rgba(255,255,255,.06); }
.sheet__foot .btn { flex: 1 1 120px; }
.sheet__p { margin: 0; color: var(--ink-dim); }
.howto2 p { margin: 0 0 8px; color: var(--ink-dim); font-size: .88rem; line-height: 1.45; max-width: 62ch; }
.howto2 b { color: var(--ink); }

.mini-row { display: flex; gap: 2px; flex-wrap: wrap; }
.mini-row .tile { --th: calc(var(--tw) * 1.36); }
.mini-row .tile__shadow { display: none; }

/* sonuç */
.sheet-wrap.is-result .sheet { width: min(640px, 100%); }
.result { display: flex; flex-direction: column; gap: 10px; }
.result__hero { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.04); }
.result__hero.is-win { background: linear-gradient(90deg, rgba(216,184,120,.22), rgba(216,184,120,.04)); box-shadow: inset 0 0 0 1px rgba(216,184,120,.4); }
.result__hero p { margin: 2px 0 0; color: var(--ink-dim); font-size: .85rem; }
.result__av { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px var(--accent-strong); flex: none; }

.result__hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.result__hand .mini-row { padding: 4px; border-radius: 6px; background: linear-gradient(180deg, var(--rack-1), var(--rack-3)); animation: sheet-in 360ms var(--ease-out) both; }
.result__table { display: flex; flex-direction: column; gap: 4px; }
.result__row { display: grid; grid-template-columns: 22px 28px 1fr auto 56px; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.04); }
.result__row.is-me { box-shadow: inset 0 0 0 1px rgba(216,184,120,.45); }
.result__rank { color: var(--ink-faint); font-weight: 800; text-align: center; }
.result__pav { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; }
.result__name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.result__delta { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink-dim); }
.result__delta.up { color: var(--ok); }
.result__delta.down { color: #e98a7c; }
.result__total { text-align: right; font-size: 1.05rem; }
.result__note { margin: 0; color: var(--ink-faint); font-size: .76rem; text-align: center; }

/* geçmiş */
.hist h3 { margin: 6px 0 6px; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.hist__row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); }

.hist__tiles { min-width: 0; }

.hist__round span { color: var(--ink-dim); }
.hud > .scorebar, .scorebar { pointer-events: auto; cursor: pointer; }

.seg button[aria-checked='true'] { background: var(--accent); color: var(--accent-ink); }
.switch { position: relative; width: 48px; height: 28px; border-radius: 999px; border: 0; background: rgba(255,255,255,.14); flex: none; transition: background 180ms; }
.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 180ms var(--ease-out); box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.switch[aria-checked='true'] { background: var(--ok); }
.switch[aria-checked='true'] i { transform: translateX(20px); }
.coach-bub { position: absolute; z-index: 250; max-width: min(300px, 70vw); transform: translate(-50%, -100%); padding: 10px 12px; border-radius: 14px; background: linear-gradient(180deg, #fff6df, #f1dfb4); color: #2a1d0b; box-shadow: 0 12px 28px rgba(0,0,0,.5); display: flex; gap: 10px; align-items: center; animation: coach-in 360ms cubic-bezier(.2,1.3,.4,1) both; }
.coach-bub::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 14px; height: 14px; background: #f1dfb4; transform: translateX(-50%) rotate(45deg); }
.coach-bub p { margin: 0; font-size: .82rem; line-height: 1.35; }
.coach-bub__ok { border: 0; border-radius: 999px; padding: 6px 12px; min-height: 32px; background: #2a1d0b; color: #fff6df; font-weight: 800; font-size: .76rem; flex: none; }
@keyframes coach-in { from { opacity: 0; transform: translate(-50%, -90%) scale(.9); } }
/* ipucu v2: tek satır, küçük, oyunu kapatmaz */
.coach-bub { max-width: 220px; padding: 5px 10px; border-radius: 8px; background: rgba(248, 238, 214, 0.96); pointer-events: none; box-shadow: 0 6px 16px rgba(0,0,0,.45); animation: coach-in 320ms cubic-bezier(.2,1.3,.4,1) both, coach-bob 1.6s ease-in-out 320ms infinite; }

@keyframes coach-bob { 50% { margin-top: -3px; } }
