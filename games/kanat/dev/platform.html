<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e141c" />
    <title>KANAT · platform harness</title>
    <style>
      :root {
        --host-safe-top: 0px;
        --host-safe-bottom: 0px;
        --safe-top: max(env(safe-area-inset-top, 0px), var(--host-safe-top));
        --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--host-safe-bottom));
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e141c;
        color: #eef3f8;
        font: 13px/1.4 system-ui, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: absolute;
        left: 12px;
        right: 12px;
        top: calc(var(--safe-top) + 10px);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        pointer-events: none;
      }
      #hud button {
        pointer-events: auto;
        font: inherit;
        color: #eef3f8;
        background: rgba(20, 28, 38, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 6px 10px;
      }
      #info {
        position: absolute;
        left: 12px;
        bottom: calc(var(--safe-bottom) + 12px);
        font: 11px/1.4 ui-monospace, monospace;
        white-space: pre;
        pointer-events: none;
        opacity: 0.85;
      }
      #devam {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 12, 0.55);
      }
      #devam button {
        font: 600 20px system-ui;
        padding: 14px 36px;
        border-radius: 14px;
        border: 0;
        background: #f2a65a;
        color: #1b1206;
      }
      .ring,
      .dot {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        transform: translate(-50%, -50%);
        display: none;
      }
      .ring {
        border: 2px solid rgba(255, 255, 255, 0.35);
      }
      .dot {
        width: 26px;
        height: 26px;
        background: rgba(242, 166, 90, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div class="ring" id="ring"></div>
      <div class="dot" id="dot"></div>
      <div id="hud">
        <button id="b-game" type="button">Uçuş (game)</button>
        <button id="b-suru" type="button">SÜRÜ</button>
        <button id="b-menu" type="button">Menü</button>
        <button id="b-pause" type="button">Duraklat</button>
        <button id="b-perf" type="button">v0.1 (5×)</button>
        <button id="b-lang" type="button">TR/EN</button>
        <button id="b-haptic" type="button">Haptik</button>
        <button id="b-share" type="button">Paylaş</button>
      </div>
      <div id="info"></div>
      <div id="devam"><button id="b-devam" type="button">Devam</button></div>
    </div>
    <script type="module" src="./platform.ts"></script>
  </body>
</html>
