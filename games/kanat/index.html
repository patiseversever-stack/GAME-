<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0e141c" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%230e141c%27/%3E%3Cpath d=%27M8 38 L32 22 L56 38 L32 30 Z%27 fill=%27%23f2a65a%27/%3E%3C/svg%3E" />
    <title>KANAT</title>
    <!--kanat:preload-->
    <style>
      :root {
        --host-safe-top: 0px;
        --host-safe-right: 0px;
        --host-safe-bottom: 0px;
        --host-safe-left: 0px;
        --safe-top: max(env(safe-area-inset-top, 0px), var(--host-safe-top));
        --safe-right: max(env(safe-area-inset-right, 0px), var(--host-safe-right));
        --safe-bottom: max(env(safe-area-inset-bottom, 0px), var(--host-safe-bottom));
        --safe-left: max(env(safe-area-inset-left, 0px), var(--host-safe-left));
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e141c;
        color: #eef3f8;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        contain: strict;
      }
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
