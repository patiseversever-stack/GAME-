<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pişti Arena — Ekran Galerisi</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #070b2e; }
  /* Masa taklidi (yalnız galeri): arena zemini, yığın altında parlayan halka, dört renk takımlı CSS kartlar.
     Gerçek oyunda masa oyun katmanında çizilir; HUD bunun üstünde saydam durur. */
  .mock { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse 90% 60% at 50% 46%, #4a66ff 0%, #2f47e0 16%, #1d30b0 34%, #14228a 52%, #0c1660 74%, #070b2e 100%); }
  .mock::before { content: ''; position: absolute; inset: 0; background-image: var(--suit-tile); background-size: 240px 240px; opacity: .05; }
  .mock::after { content: ''; position: absolute; left: 50%; top: 46%; width: 62vw; height: 62vw; margin: -31vw 0 0 -31vw; border-radius: 50%;
    background: radial-gradient(circle, rgba(140, 170, 255, .35) 0%, rgba(110, 140, 255, .12) 45%, rgba(61, 91, 255, 0) 64%);
    box-shadow: inset 0 0 0 3px rgba(160, 185, 255, .35); }
  .mock .c { position: absolute; z-index: 1; width: 17vw; height: 24vw; border-radius: 1.6vw; background: linear-gradient(180deg, #ffffff, #eef1ff);
    box-shadow: 0 0 0 .5vw #0a1033, 0 1vw 0 .5vw #0a1033, 0 2vw 3vw rgba(2,4,24,.45); font: 400 7vw/1 'Lilita One', sans-serif; color: #1f7bff; }
  .mock .c.h { color: #ff2e4d; } .mock .c.d { color: #ffb400; } .mock .c.cl { color: #16c45b; }
  .mock .c b { position: absolute; left: 9%; top: 6%; text-align: center; }
  .mock .c b small { display: block; font-size: .8em; }
  .mock .c i { position: absolute; right: 9%; bottom: 6%; font-style: normal; font-size: 9vw; }
  .mock .c.bk { background: radial-gradient(circle at 50% 50%, #3d5bff 0%, #1f2c8c 70%); box-shadow: 0 0 0 .5vw #0a1033, inset 0 0 0 1vw #fff, 0 1vw 0 .5vw #0a1033, 0 2vw 3vw rgba(2,4,24,.45); }
  .mock .c.bk::after { content: ''; position: absolute; inset: 30% 26%; border-radius: 50%; background: conic-gradient(from -45deg, #ff2e4d 0 25%, #ffb400 0 50%, #16c45b 0 75%, #1f7bff 0 100%); box-shadow: 0 0 0 .5vw #fff; }
  .mock .c.bk > * { display: none; }
  .mock .hand .c { width: 25vw; height: 35vw; font-size: 9.5vw; border-radius: 2.2vw; }
  .mock .hand .c i { font-size: 13vw; }
  .mock .opp .c { width: 13vw; height: 18vw; }
  .gal { position: fixed; inset: 0; overflow: auto; padding: 20px; color: #e6eaff; font: 15px/1.5 system-ui, sans-serif; background: #0c1456; touch-action: auto; }
  .gal a { display: inline-block; margin: 4px 8px 4px 0; padding: 8px 12px; border: 1px solid #3a4bd6; border-radius: 8px; color: #ffd23f; text-decoration: none; }
  .gal h1 { font-size: 18px; margin: 0 0 10px; }
</style>
</head>
<body>
<script type="module" src="./screens.ts"></script>
</body>
</html>
