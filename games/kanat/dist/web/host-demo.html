<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11161d" />
    <title>KANAT · Host demo</title>
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark;--bg:#11161d;--panel:#1a222c;--line:#2b3746;--text:#e6edf5;--muted:#8da0b5;--accent:#f2a65a;--in:#7cc4ff;--out:#9be39b}*{box-sizing:border-box}body{background:var(--bg);color:var(--text);flex-wrap:wrap;gap:16px;min-height:100vh;margin:0;padding:16px;font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex}.device{background:#000;border:10px solid #000;border-radius:36px;flex:none;overflow:hidden;box-shadow:0 10px 40px #00000080}iframe{background:#0e141c;border:0;display:block}.side{flex-direction:column;flex:360px;gap:12px;min-width:300px;display:flex}fieldset{border:1px solid var(--line);background:var(--panel);border-radius:10px;margin:0;padding:8px 10px 10px}legend{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:0 4px;font-size:11px}button{font:inherit;color:var(--text);cursor:pointer;background:#253142;border:1px solid #344458;border-radius:7px;margin:3px 3px 0 0;padding:5px 10px}button:hover{border-color:var(--accent)}button[aria-pressed=true]{border-color:var(--accent);background:#3b2a17}input[type=text]{font:inherit;color:var(--text);background:#0f141a;border:1px solid #344458;border-radius:6px;width:140px;padding:4px 6px}#log{border:1px solid var(--line);background:#0b0f14;border-radius:10px;flex:1;min-height:240px;max-height:60vh;padding:8px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto}#log div{white-space:pre-wrap;word-break:break-all;border-bottom:1px solid #151c25;padding:2px 0}.in{color:var(--in)}.out{color:var(--out)}.muted,#status{color:var(--muted)}</style>
    <script type="module" crossorigin src="./assets/host-demo-C4bE8lA_.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
  </head>
  <body>
    <div class="device" id="device"><iframe id="game" title="KANAT" allow="autoplay; fullscreen; clipboard-write; web-share"></iframe></div>
    <div class="side">
      <div id="status">Oyun yükleniyor…</div>
      <fieldset>
        <legend>Yaşam döngüsü</legend>
        <button data-cmd="pause">Duraklat (pause)</button>
        <button data-cmd="resume">Devam (resume)</button>
        <button data-cmd="back">Geri (back)</button>
        <button id="reload">Oyunu yeniden yükle</button>
      </fieldset>
      <fieldset>
        <legend>Ses ve dil</legend>
        <button id="mute" aria-pressed="false">Sessiz (mute)</button>
        <button data-lang="tr">TR</button>
        <button data-lang="en">EN</button>
      </fieldset>
      <fieldset>
        <legend>Kalite (setQuality)</legend>
        <button data-tier="auto">Otomatik</button>
        <button data-tier="ultra">Ultra</button>
        <button data-tier="high">Yüksek</button>
        <button data-tier="medium">Orta</button>
        <button data-tier="low">Düşük</button>
      </fieldset>
      <fieldset>
        <legend>Güvenli alan ve cihaz</legend>
        <button data-safe="47,0,34,0">Çentikli (47/34)</button>
        <button data-safe="24,0,0,0">Durum çubuğu (24)</button>
        <button data-safe="0,0,0,0">Sıfır</button>
        <button data-size="390x844">Dikey 390×844</button>
        <button data-size="844x390">Yatay 844×390</button>
      </fieldset>
      <fieldset>
        <legend>Profil ve depolama</legend>
        <input type="text" id="name" value="Ayşe" aria-label="Görünen ad" />
        <button id="profile">setProfile</button>
        <button id="hoststorage" aria-pressed="true">Host depolama: açık</button>
        <button id="roundtrip">Depolama gidiş-dönüş (yeniden yükle)</button>
        <button id="clearstorage">Host depolamayı sil</button>
      </fieldset>
      <fieldset>
        <legend>Log</legend>
        <button id="clear">Temizle</button>
        <span class="muted">yeşil = oyun → host · mavi = host → oyun</span>
      </fieldset>
      <div id="log" aria-live="polite"></div>
    </div>
  </body>
</html>
