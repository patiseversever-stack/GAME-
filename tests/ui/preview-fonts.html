<!doctype html>
<html lang="tr" data-theme="lounge" data-rack="walnut" data-tiles="ivory">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles/fonts.generated.css"><link rel="stylesheet" href="../../styles/tokens.css"><link rel="stylesheet" href="../../styles/tile.css">
<style>body{margin:0;background:var(--felt-mid);color:var(--ink);font-family:var(--font-ui);padding:14px}h3{margin:12px 0 6px;font-size:12px;color:var(--ink-dim)}.row{display:flex;gap:8px;padding:10px;background:rgba(0,0,0,.18);border-radius:10px}</style></head>
<body><div id="out"></div>
<script type="module">
import { createTileEl } from '../../src/ui/tile-dom.js';
import { makeCtx, tileId } from '../../src/game/tiles.js';
const ctx = makeCtx(tileId(0, 6));
const out = document.getElementById('out');
const fonts = { 'Barlow Condensed 800': "'Barlow Condensed'", 'DM Sans 800': "'DM Sans'", 'Playfair Display 800': "'Playfair Display'" };
for (const [name, fam] of Object.entries(fonts)) {
  const h = document.createElement('h3'); h.textContent = name; out.appendChild(h);
  const r = document.createElement('div'); r.className = 'row'; r.style.setProperty('--tw', (new URLSearchParams(location.search).get('tw')||'44')+'px'); r.style.setProperty('--font-num', fam + ', sans-serif');
  for (const [c, v] of [[0,1],[1,1],[2,11],[3,7],[0,13],[1,4],[2,9],[3,10],[0,12],[1,3]]) { const el = createTileEl(tileId(c, v), ctx, { inline: true }); el.style.fontFamily = 'var(--font-num)'; r.appendChild(el); }
  out.appendChild(r);
}
document.body.dataset.ready = '1';
</script></body></html>
